name: HealthPPiOS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  HealthPPiOS:
    type: application
    platform: iOS
    sources: [HealthPPiOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthpp.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "HealthPP usa Bluetooth para recibir los datos de salud de tu Galaxy Watch."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: bluetooth-central
        SWIFT_VERSION: "5.0"
